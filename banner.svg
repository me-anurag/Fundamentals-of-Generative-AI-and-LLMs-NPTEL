<svg width="1600" height="500" viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Main background -->
  <linearGradient id="background" x1="0" y1="0" x2="1600" y2="500">
    <stop offset="0%" stop-color="#F8FAFF"></stop>
    <stop offset="50%" stop-color="#FFFFFF"></stop>
    <stop offset="100%" stop-color="#EFF6FF"></stop>
  </linearGradient>

  <!-- Text accent -->
  <linearGradient id="blueAccent">
    <stop stop-color="#2563EB"></stop>
    <stop offset="1" stop-color="#60A5FA"></stop>
  </linearGradient>

  <!-- Blur -->
  <filter id="blur">
    <feGaussianBlur stdDeviation="50"></feGaussianBlur>
  </filter>

</defs>


<!-- Background -->
<rect width="1600" height="500" fill="url(#background)"></rect>


<!-- Soft abstract shapes -->

<circle cx="150" cy="80" r="180" fill="#BFDBFE" opacity="0.45" filter="url(#blur)"></circle>

<circle cx="1450" cy="80" r="230" fill="#DDD6FE" opacity="0.45" filter="url(#blur)"></circle>

<ellipse cx="300" cy="470" rx="330" ry="160" fill="#DBEAFE" opacity="0.6" filter="url(#blur)"></ellipse>

<ellipse cx="1300" cy="450" rx="350" ry="170" fill="#FCE7F3" opacity="0.45" filter="url(#blur)"></ellipse>

<circle cx="800" cy="250" r="260" fill="#EFF6FF" opacity="0.8"></circle>


<!-- Title -->

<text x="800" y="150" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="700" fill="#0F172A">

Fundamentals of Generative AI

</text>


<text x="800" y="215" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="700" fill="#0F172A">

and Large Language Models

</text>


<!-- Divider -->

<rect x="520" y="255" width="560" height="5" rx="3" fill="url(#blueAccent)"></rect>


<!-- NPTEL -->

<text x="800" y="330" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="800" fill="#2563EB">

NPTEL

</text>


<!-- Subtitle -->

<text x="800" y="375" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="500" fill="#475569">

Theory and Practice

</text>


<!-- Topics -->

<text x="800" y="425" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#64748B">

Transformers • Prompt Engineering • Fine-tuning • RAG • Agents

</text>


<!-- Footer -->

<text x="800" y="465" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#94A3B8">

Notes • Assignments • Revision • Practice Questions • Resources

</text>


</svg>